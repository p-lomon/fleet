[project]
name = "host"
version = "0.1.0"
description = "Job submission host environment"
requires-python = ">=3.11"
dependencies = [
    "queue-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["host"]

[tool.uv.sources]
queue-core = { workspace = true }
