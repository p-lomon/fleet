[project]
name = "queue-core"
version = "0.1.0"
description = "Core queue infrastructure for job processing"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["queue_core"]
