[project]
name = "dashboard"
version = "0.1.0"
description = "Web dashboard for job queue monitoring"
requires-python = ">=3.11"
dependencies = [
    "queue-core",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashboard"]
